name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/go.sum'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to re-review
        required: true
        type: number

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  guard:
    # Dependabot bumps are gated by CI + auto-approve; fork PRs get no secrets.
    if: github.event.pull_request.user.login != 'dependabot[bot]' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      same_repo: ${{ steps.check.outputs.same_repo }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          cross=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json isCrossRepository -q .isCrossRepository)
          if [ "$cross" = "false" ]; then echo "same_repo=true" >> "$GITHUB_OUTPUT"; else echo "same_repo=false" >> "$GITHUB_OUTPUT"; fi

  review:
    needs: guard
    if: needs.guard.outputs.same_repo == 'true'
    uses: MnemoShare/ci-workflows/.github/workflows/claude-review.yml@v1
    with:
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AUTO_APPROVE_PRIVATE_KEY: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}
    permissions:
      contents: read
      pull-requests: read
